[package]
name = "loom"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"